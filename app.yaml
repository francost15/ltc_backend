runtime: custom
env: flex

service: default

automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 1
  max_instances: 10
  min_idle_instances: 1
  max_idle_instances: 3
  min_pending_latency: 30ms
  max_pending_latency: 10s

resources:
  cpu: 1
  memory_gb: 2
  disk_size_gb: 10

env_variables:
  DATABASE_URL: "postgresql://ltc_user:ltc_password_2024@/ltc_db?host=/cloudsql/PROJECT_ID:REGION:INSTANCE_NAME"
  FLASK_DEBUG: "False"
  SECRET_KEY: "tu-clave-secreta-super-segura-ltc-2024-produccion"
  UPLOAD_FOLDER: "/tmp/uploads"
  MAX_CONTENT_LENGTH: "16777216"

beta_settings:
  cloud_sql_instances: "PROJECT_ID:REGION:INSTANCE_NAME"

handlers:
  - url: /.*
    script: auto
    secure: always

liveness_check:
  path: "/health"
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2

readiness_check:
  path: "/health"
  check_interval_sec: 5
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2
  app_start_timeout_sec: 300 