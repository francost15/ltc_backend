services:
  # Servicio principal de la API
  - type: web
    name: ltc-backend-api
    env: python
    plan: starter  # $7/mes, o free para desarrollo
    region: oregon  # us-west-1
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 4 --timeout 120 app:create_app()
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: UPLOAD_FOLDER
        value: /opt/render/project/src/uploads
      - key: MAX_CONTENT_LENGTH
        value: 16777216
      - key: DATABASE_URL
        fromDatabase:
          name: ltc-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false  # Configurar manualmente en el dashboard

databases:
  # Base de datos PostgreSQL
  - name: ltc-postgres
    databaseName: ltc_db
    user: ltc_user
    plan: starter  # $7/mes, o free para desarrollo
    region: oregon 