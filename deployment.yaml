apiVersion: apps/v1
kind: Deployment
metadata:
  name: ltc-backend
  labels:
    app: ltc-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ltc-backend
  template:
    metadata:
      labels:
        app: ltc-backend
    spec:
      containers:
      - name: ltc-backend
        image: gcr.io/PROJECT_ID/ltc-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql://ltc_user:ltc_password_2024@/ltc_db?host=/cloudsql/PROJECT_ID:REGION:INSTANCE_NAME"
        - name: FLASK_DEBUG
          value: "False"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ltc-secrets
              key: secret-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ltc-secrets
              key: openai-api-key
        - name: UPLOAD_FOLDER
          value: "/tmp/uploads"
        - name: MAX_CONTENT_LENGTH
          value: "16777216"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: uploads-volume
          mountPath: /tmp/uploads
      volumes:
      - name: uploads-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ltc-backend-service
spec:
  selector:
    app: ltc-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ltc-backend-ingress
  annotations:
    kubernetes.io/ingress.global-static-ip-name: "ltc-backend-ip"
    networking.gke.io/managed-certificates: "ltc-backend-cert"
spec:
  rules:
  - host: api.tudominio.com  # Cambiar por tu dominio
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ltc-backend-service
            port:
              number: 80 