version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: ltc_postgres
    environment:
      POSTGRES_DB: ltc_db
      POSTGRES_USER: ltc_user
      POSTGRES_PASSWORD: ltc_password_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - ltc_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ltc_user -d ltc_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplicación Python
  app:
    build: .
    container_name: ltc_backend
    environment:
      # Base de datos local
      DATABASE_URL: postgresql://ltc_user:ltc_password_2024@postgres:5432/ltc_db
      
      # OpenAI (configurar tu API key)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-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}
      
      # Configuración Flask
      FLASK_DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-tu-clave-secreta-super-segura-ltc-2024}
      
      # Configuración de la aplicación
      UPLOAD_FOLDER: /app/uploads
      MAX_CONTENT_LENGTH: 16777216
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ltc_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis para caché (opcional, para mejorar rendimiento)
  redis:
    image: redis:7-alpine
    container_name: ltc_redis
    ports:
      - "6379:6379"
    networks:
      - ltc_network
    restart: unless-stopped

  # Nginx como proxy reverso (opcional)
  nginx:
    image: nginx:alpine
    container_name: ltc_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - ltc_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  ltc_network:
    driver: bridge 